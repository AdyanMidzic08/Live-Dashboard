services:
  frontend:
    build: .
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    volumes:
      - .:/app
      - /app/node_modules
    restart: always

  todo-server:
    build: .
    ports:
      - "3000:3000"
    command: npm run todo
    volumes:
      - .:/app
      - /app/node_modules
    restart: always
