<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Tester | Live Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <style>
      body {
        background: #e9ecef;
      }
      .card {
        border: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }
      pre {
        max-height: 200px;
        overflow: auto;
      }
    </style>
  </head>
  <body class="p-4">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="font-weight-bold">API Testing Console</h1>
        <a href="/" class="btn btn-secondary shadow-sm"
          >&larr; Back to Documentation</a
        >
      </div>

      <div class="row">
        <!-- CREATE -->
        <div class="col-md-6">
          <div class="card p-4 mb-4">
            <h4 class="text-primary mb-3">
              POST <small class="text-muted">Create Todo</small>
            </h4>
            <div class="form-group">
              <label>Title</label>
              <input
                type="text"
                id="title"
                class="form-control"
                placeholder="Buy milk"
              />
            </div>
            <div class="form-group">
              <label>Due Date</label>
              <input type="date" id="date" class="form-control" />
            </div>
            <button
              onclick="createTodo()"
              class="btn btn-primary btn-block font-weight-bold"
            >
              Send Request
            </button>
            <div class="mt-3">
              <small class="text-muted">Response:</small>
              <pre id="postResult" class="bg-dark text-white p-3 rounded mt-1">
Waiting...</pre
              >
            </div>
          </div>
        </div>

        <!-- DELETE -->
        <div class="col-md-6">
          <div class="card p-4 mb-4">
            <h4 class="text-danger mb-3">
              DELETE <small class="text-muted">Remove Todo</small>
            </h4>
            <div class="form-group">
              <label>Todo ID</label>
              <input
                type="text"
                id="deleteId"
                class="form-control"
                placeholder="e.g. 123-abc..."
              />
            </div>
            <button
              onclick="deleteTodo()"
              class="btn btn-danger btn-block font-weight-bold"
            >
              Send Request
            </button>
            <div class="mt-3">
              <small class="text-muted">Response:</small>
              <pre
                id="deleteResult"
                class="bg-dark text-white p-3 rounded mt-1"
              >
Waiting...</pre
              >
            </div>
          </div>
        </div>
      </div>

      <!-- LIST VIEW -->
      <div class="row">
        <div class="col-12">
          <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4 class="text-info mb-0">
                GET <small class="text-muted">Current Todos</small>
              </h4>
              <button
                onclick="fetchTodos()"
                class="btn btn-outline-info btn-sm"
              >
                Refresh List
              </button>
            </div>
            <pre
              id="getResult"
              class="bg-dark text-white p-3 rounded mb-0"
              style="max-height: 400px"
            >
Waiting...</pre
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      async function createTodo() {
        const title = document.getElementById("title").value;
        const dueDate = document.getElementById("date").value;
        const output = document.getElementById("postResult");

        output.innerText = "Sending...";

        try {
          const res = await fetch("/todos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, dueDate, completed: false }),
          });
          const data = await res.json();
          output.innerText = JSON.stringify(data, null, 2);
          fetchTodos();
        } catch (e) {
          output.innerText = "Error: " + e.message;
        }
      }

      async function deleteTodo() {
        const id = document.getElementById("deleteId").value;
        const output = document.getElementById("deleteResult");

        if (!id) {
          output.innerText = "Please enter an ID";
          return;
        }

        output.innerText = "Sending...";

        try {
          const res = await fetch("/todos/" + id, { method: "DELETE" });
          const data = await res.json();
          output.innerText = JSON.stringify(data, null, 2);
          fetchTodos();
        } catch (e) {
          output.innerText = "Error: " + e.message;
        }
      }

      async function fetchTodos() {
        const output = document.getElementById("getResult");
        try {
          const res = await fetch("/todos");
          const data = await res.json();
          output.innerText = JSON.stringify(data, null, 2);
        } catch (e) {
          output.innerText = "Error fetching todos";
        }
      }

      // Load initially
      fetchTodos();
    </script>
  </body>
</html>
